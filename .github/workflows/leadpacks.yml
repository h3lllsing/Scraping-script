name: Lead Packs (canary)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/leadpacks.yml"
      - "generate_leadpack.py"
      - "leadpacks.json"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate lead packs (canary — validates the live API + quality gate)
        run: python generate_leadpack.py --all
        env:
          LEADPACK_API: "https://scraping-script-xi.vercel.app"

      - name: Note
        run: |
          echo "Packs are generated into the gitignored 'packs/' folder and are NOT committed."
          echo "Paid packs stay private: generate locally weekly and upload ZIPs to Gumroad."
          echo "See docs/leads/paid/README.md."