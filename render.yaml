services:
  - type: web
    name: business-scraper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SCRAPER_USER_AGENT
        sync: false
      - key: OVERPASS_DEADLINE
        value: 15
      - key: ENRICH_MAX_SITES
        value: 4
      - key: RATE_LIMIT_PER_IP
        value: 30
      - key: DATABASE_URL
        sync: false
      - key: LEADS_API_KEY
        sync: false